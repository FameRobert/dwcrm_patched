<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="We are currently undergoing scheduled maintenance. Please check back soon." />
    <title>Under Maintenance</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <div class="maintenance-container">
      <div class="background-elements">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
      </div>
      
      <main class="glass-card">
        <div class="icon-container">
          <svg xmlns="http://www.w3.org/2000/svg" class="wrench-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"></path>
          </svg>
        </div>
        
        <h1 class="title">Under Maintenance</h1>
        <p class="description">
          We are currently upgrading our platform to serve you better. 
          We will be back online shortly. Thank you for your patience!
        </p>
        
        <div class="progress-bar-container">
          <div class="progress-bar"></div>
        </div>
        
        <div class="contact-info">
          Need urgent help? <a href="mailto:support@example.com">Contact Support</a>
        </div>
      </main>
    </div>
  </body>
</html>
